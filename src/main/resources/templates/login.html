<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — SESTERA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:     #c9a84c;
      --gold-d:   #8a6f2e;
      --dark:     #1c1a17;
      --muted:    #7a6e5f;
      --muted2:   #b0a490;
      --border:   rgba(28,26,23,0.12);
      --serif:    'Cormorant Garamond', Georgia, serif;
      --sans:     'DM Sans', system-ui, sans-serif;
      --mono:     'JetBrains Mono', monospace;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      display: flex; align-items: center; justify-content: flex-end;
      min-height: 100vh; overflow: hidden; position: relative;
      padding-right: 6vw;
    }

    /* ── Warm background ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('/images/auth-bg.jpg');
      background-size: cover;
      background-position: center left;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.22) 100%);
    }

    /* ── Card ── */
    .card {
      position: relative; z-index: 2;
      width: 520px;
      background: rgba(253,249,242,0.93);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      padding: 52px 48px;
      box-shadow:
        0 2px 0 rgba(255,255,255,0.8) inset,
        0 24px 60px rgba(60,35,10,0.28),
        0 6px 20px rgba(60,35,10,0.15);
      animation: rise 0.55s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo { display: block; width: 220px; margin: 0 auto 24px; }
    .divider {
      width: 40px; height: 1px;
      background: var(--gold); opacity: .55;
      margin: 0 auto 26px;
    }
    .title {
      font-family: var(--serif); font-size: 30px; font-weight: 600;
      color: var(--dark); text-align: center; margin-bottom: 6px;
      letter-spacing: -.01em;
    }
    .subtitle {
      font-size: 14px; color: var(--muted2);
      text-align: center; margin-bottom: 32px;
    }

    /* Alert */
    .alert { padding: 11px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; }
    .alert-danger  { background: rgba(192,57,43,.08); border: 1px solid rgba(192,57,43,.2); color: #9b3a2c; }
    .alert-success { background: rgba(45,125,82,.08); border: 1px solid rgba(45,125,82,.2); color: #2d6040; }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .label {
      display: block; font-size: 10px; font-family: var(--mono);
      color: var(--muted); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 7px;
    }
    .input {
      width: 100%;
      background: rgba(255,252,245,0.8);
      border: 1px solid rgba(28,26,23,0.14);
      border-radius: 10px; padding: 14px 16px;
      color: var(--dark); font-family: var(--sans); font-size: 15px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
      background: #fff;
    }
    .input::placeholder { color: var(--muted2); }

    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 15px; border-radius: 10px;
      background: var(--dark); border: none;
      color: #faf7f2; font-family: var(--sans); font-size: 15px; font-weight: 500;
      letter-spacing: .02em; cursor: pointer; margin-top: 26px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn:hover { background: #2e2b26; box-shadow: 0 4px 16px rgba(28,26,23,0.2); }

    .link {
      display: block; text-align: center; margin-top: 18px;
      font-size: 13px; color: var(--muted2); text-decoration: none;
    }
    .link span {
      color: var(--dark); font-weight: 500;
      text-decoration: underline; text-underline-offset: 3px;
    }
  </style>
</head>
<body>

<!-- SVG grain filter -->
<svg style="position:fixed;width:0;height:0;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
</svg>

<div class="bg"></div>
<div class="vignette"></div>

<div class="card">
  <img src="/images/logo.png" th:src="@{/images/logo.png}" alt="SESTERA" class="logo">
  <div class="divider"></div>
  <div class="title">С возвращением</div>
  <div class="subtitle">Войдите в свой аккаунт Sestera</div>

  <div th:if="${param.error}" class="alert alert-danger">
    Неверное имя пользователя или пароль.
  </div>
  <div th:if="${param.logout}" class="alert alert-success">
    Вы успешно вышли из системы.
  </div>

  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="form-group">
      <label class="label">Имя пользователя</label>
      <input type="text" name="username" class="input" placeholder="Введите имя" required>
    </div>
    <div class="form-group">
      <label class="label">Пароль</label>
      <input type="password" name="password" class="input" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Войти</button>
  </form>

  <a th:href="@{/register}" href="/register" class="link">
    Нет аккаунта? <span>Зарегистрироваться</span>
  </a>
</div>

</body>
</html>
