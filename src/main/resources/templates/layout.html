<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sestera — Личные финансы</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:    #f7f3ec;
      --cream2:   #efe9df;
      --cream3:   #e5ddd1;
      --white:    #ffffff;
      --dark:     #1c1a17;
      --dark2:    #2e2b26;
      --muted:    #8a8070;
      --muted2:   #b0a898;
      --gold:     #c9a84c;
      --gold-bg:  rgba(201,168,76,0.08);
      --success:  #2d7d52;
      --danger:   #c0392b;
      --border:   rgba(28,26,23,0.10);
      --border2:  rgba(28,26,23,0.06);
      --shadow:   0 1px 3px rgba(28,26,23,0.06), 0 4px 16px rgba(28,26,23,0.06);
      --shadow-sm:0 1px 2px rgba(28,26,23,0.05), 0 2px 8px rgba(28,26,23,0.04);
      --serif:    'Cormorant Garamond', Georgia, serif;
      --sans:     'DM Sans', system-ui, sans-serif;
      --mono:     'JetBrains Mono', monospace;
      --radius:   8px;
      --radius-lg:12px;
      --sidebar-w:230px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--cream); color: var(--dark); font-family: var(--sans); font-size: 14px; line-height: 1.6; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--cream3); border-radius: 99px; }

    /* ── Layout ── */
    .au-layout { display: flex; min-height: 100vh; }
    .au-main   { flex: 1; padding: 32px; background: var(--cream); }
    body       { overflow-x: hidden; }

    /* ── Sidebar ── */
    .au-sidebar {
      width: var(--sidebar-w); min-height: 100vh;
      background: var(--white); border-right: 1px solid var(--border2);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; flex-shrink: 0;
    }
    .au-sidebar-logo { padding: 24px 22px 18px; border-bottom: 1px solid var(--border2); }
    .au-sidebar-logo img { width: 160px; }
    .au-nav { padding: 16px 12px; flex: 1; }
    .au-nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 13px; border-radius: var(--radius);
      text-decoration: none; color: var(--muted);
      font-family: var(--sans); font-size: 13.5px; font-weight: 400;
      transition: all 0.18s ease; margin-bottom: 2px;
    }
    .au-nav-link i { font-size: 15px; }
    .au-nav-link:hover { background: var(--cream); color: var(--dark); }
    .au-nav-link.active { background: var(--cream); color: var(--dark); font-weight: 500; }
    .au-nav-link.active i { color: var(--gold); }
    .au-sidebar-footer { padding: 14px 12px; border-top: 1px solid var(--border2); }
    .au-logout-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 10px 13px; border-radius: var(--radius);
      background: none; border: none;
      color: var(--muted2); font-size: 13.5px; font-family: var(--sans);
      cursor: pointer; width: 100%; transition: all 0.18s;
    }
    .au-logout-btn:hover { background: rgba(192,57,43,0.06); color: var(--danger); }

    /* ── Cards ── */
    .au-card {
      background: var(--white); border: 1px solid var(--border2);
      border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm);
    }

    /* ── Page header ── */
    .au-page-title {
      font-family: var(--serif); font-size: 28px; font-weight: 600;
      color: var(--dark); letter-spacing: -0.01em; margin-bottom: 24px; line-height: 1.2;
    }
    .au-section-title {
      font-size: 10px; font-family: var(--sans); font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--muted2); margin-bottom: 14px;
    }

    /* ── Stat ── */
    .au-stat-label {
      font-size: 10px; font-family: var(--sans); letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted2); margin-bottom: 8px; font-weight: 500;
    }
    .au-stat-value {
      font-family: var(--mono); font-size: 24px; font-weight: 600; line-height: 1;
    }
    .au-stat-sub { font-size: 11px; color: var(--muted2); margin-top: 5px; }
    .au-stat-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }

    /* ── Table ── */
    .au-table { width: 100%; border-collapse: collapse; }
    .au-table th {
      font-family: var(--sans); font-size: 10px; font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted2);
      padding: 10px 16px; border-bottom: 1px solid var(--border2); text-align: left;
    }
    .au-table td {
      padding: 12px 16px; border-bottom: 1px solid var(--border2);
      font-size: 13.5px; color: var(--dark);
    }
    .au-table tbody tr { transition: background 0.15s; }
    .au-table tbody tr:hover { background: var(--cream); }
    .au-table tbody tr:last-child td { border-bottom: none; }

    /* ── Badges ── */
    .au-badge {
      display: inline-flex; align-items: center; padding: 3px 8px;
      border-radius: 4px; font-family: var(--sans); font-size: 11px; font-weight: 500;
    }
    .au-badge-success { background: rgba(45,125,82,0.10); color: var(--success); }
    .au-badge-danger  { background: rgba(192,57,43,0.08);  color: var(--danger); }
    .au-badge-gold    { background: var(--gold-bg); color: var(--gold); }

    /* ── Buttons ── */
    .au-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: var(--radius);
      font-family: var(--sans); font-size: 13.5px; font-weight: 500;
      cursor: pointer; border: none; transition: all 0.18s; text-decoration: none;
    }
    .au-btn-primary { background: var(--dark); color: var(--white); }
    .au-btn-primary:hover { background: var(--dark2); box-shadow: 0 4px 14px rgba(28,26,23,0.18); color: var(--white); }
    .au-btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .au-btn-outline:hover { border-color: var(--dark); color: var(--dark); background: var(--cream); }
    .au-btn-ghost { background: var(--cream); color: var(--dark); border: 1px solid var(--border2); }
    .au-btn-ghost:hover { background: var(--cream2); }
    .au-btn-danger { background: rgba(192,57,43,0.08); color: var(--danger); border: 1px solid rgba(192,57,43,0.15); }
    .au-btn-danger:hover { background: rgba(192,57,43,0.14); }
    .au-btn-sm { padding: 6px 12px; font-size: 12px; }

    /* ── Form controls ── */
    .au-form-group { margin-bottom: 16px; }
    .au-label {
      display: block; font-size: 10px; font-family: var(--mono);
      color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 7px;
    }
    .au-input {
      width: 100%; background: var(--cream);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 11px 13px; color: var(--dark); font-family: var(--sans);
      font-size: 14px; outline: none; transition: all 0.18s;
    }
    .au-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-bg); background: #fff; }
    .au-input::placeholder { color: var(--muted2); }
    .au-select {
      width: 100%; background: var(--cream);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 11px 13px; color: var(--dark); font-family: var(--sans);
      font-size: 14px; outline: none; transition: all 0.18s; appearance: none; cursor: pointer;
    }
    .au-select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-bg); }

    /* ── Modal ── */
    .au-modal .modal-content {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); color: var(--dark); box-shadow: var(--shadow);
    }
    .au-modal .modal-header { border-bottom: 1px solid var(--border2); padding: 20px 24px; }
    .au-modal .modal-title { font-family: var(--serif); font-size: 20px; font-weight: 600; }
    .au-modal .modal-body { padding: 24px; }

    /* ── Alert ── */
    .au-alert { padding: 11px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; }
    .au-alert-danger  { background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.2); color: #9b3a2c; }
    .au-alert-success { background: rgba(45,125,82,0.08);  border: 1px solid rgba(45,125,82,0.2);  color: #2d6040; }

    /* ── Pagination ── */
    .au-pagination { display: flex; gap: 5px; align-items: center; }
    .au-page-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius); font-family: var(--mono); font-size: 12px; font-weight: 500;
      text-decoration: none; color: var(--muted); background: var(--white);
      border: 1px solid var(--border2); transition: all 0.18s;
    }
    .au-page-btn:hover { border-color: var(--dark); color: var(--dark); }
    .au-page-btn.active { background: var(--dark); border-color: var(--dark); color: #fff; }
    .au-page-btn.disabled { opacity: 0.35; pointer-events: none; }

    /* ── Dropdown fix ── */
    .dropdown-menu.show { z-index: 99999 !important; position: fixed !important; }

    /* ── Animations ── */
    @keyframes au-fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .au-fade    { animation: au-fade-up 0.35s ease both; }
    .au-fade-d1 { animation-delay: 0.05s; }
    .au-fade-d2 { animation-delay: 0.10s; }
    .au-fade-d3 { animation-delay: 0.15s; }
    .au-fade-d4 { animation-delay: 0.20s; }

    /* ── Spinner ── */
    .au-spinner {
      width: 16px; height: 16px; border: 2px solid var(--cream3);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div th:fragment="sidebar" class="au-sidebar">
  <div class="au-sidebar-logo">
    <img th:src="@{/images/logo.png}" alt="SESTERA">
  </div>
  <nav class="au-nav">
    <a href="/"
       th:classappend="${currentUri == '/'} ? ' active' : ''"
       class="au-nav-link">
      <i class="bi bi-grid-1x2"></i>Главная
    </a>
    <a href="/transactions"
       th:classappend="${currentUri != null and currentUri.startsWith('/transactions')} ? ' active' : ''"
       class="au-nav-link">
      <i class="bi bi-arrow-left-right"></i>Транзакции
    </a>
    <a href="/categories"
       th:classappend="${currentUri != null and currentUri.startsWith('/categories')} ? ' active' : ''"
       class="au-nav-link">
      <i class="bi bi-tag"></i>Категории
    </a>
    <a href="/news"
       th:classappend="${currentUri != null and currentUri.startsWith('/news')} ? ' active' : ''"
       class="au-nav-link">
      <i class="bi bi-newspaper"></i>Новости
    </a>
    <a href="/settings"
       th:classappend="${currentUri != null and currentUri.startsWith('/settings')} ? ' active' : ''"
       class="au-nav-link">
      <i class="bi bi-gear"></i>Настройки
    </a>
  </nav>
  <div class="au-sidebar-footer">
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="au-logout-btn">
        <i class="bi bi-box-arrow-right"></i>Выход
      </button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
